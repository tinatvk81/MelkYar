version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # پورت دیتابیس عمداً به بیرون expose نشده — فقط سرویس‌های داخل همین
    # شبکه‌ی docker-compose (یعنی web) به آن دسترسی دارند.

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      - db

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      # برای HTTPS واقعی، گواهی SSL را با certbot بگیرید و پورت 443 را هم
      # اضافه کنید (جزئیات در SECURITY.md)
    volumes:
      - ./nginx/melkyar.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      - web

volumes:
  postgres_data:
  static_volume:
  media_volume:
